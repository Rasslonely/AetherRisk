[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
cc3_testnet = "https://rpc.cc3-testnet.creditcoin.network"
sepolia = "https://sepolia.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"
cc3_mainnet = "https://mainnet3.creditcoin.network"
